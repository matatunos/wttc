name: App Android y Release

on:
  push:
    branches: [main]
    paths: ['android/**', 'firmware/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # solo para publicar el APK en Releases
    env:
      WTTC_VERSION_CODE: ${{ github.run_number }}
      WTTC_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Firma estable para que cada versión se instale encima de la anterior.
      # La clave vive solo en los secretos del repo; sin ellos se firma con una clave de depuración.
      - name: Clave de firma
        env:
          KS_B64: ${{ secrets.WTTC_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.WTTC_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.WTTC_KEY_ALIAS }}
        shell: bash
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::Sin clave de firma en los secretos: APK firmado con clave de depuración"
            exit 0
          fi
          echo "::add-mask::$KS_PASS"
          ks="$RUNNER_TEMP/wttc.p12"
          # Quita espacios y saltos de línea que se cuelan al pegar el secreto
          if ! printf '%s' "$KS_B64" | tr -d ' \t\r\n' | base64 -d > "$ks" 2>/dev/null; then
            echo "::error::WTTC_KEYSTORE_B64 no es base64 válido (¿se pegó incompleto?)"; exit 1
          fi
          echo "Keystore: $(stat -c %s "$ks") bytes"
          if [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::Faltan los secretos WTTC_KEYSTORE_PASSWORD o WTTC_KEY_ALIAS"; exit 1
          fi
          if ! keytool -list -keystore "$ks" -storetype PKCS12 -storepass "$KS_PASS" >/dev/null 2>&1; then
            echo "::error::El keystore no abre con WTTC_KEYSTORE_PASSWORD (contraseña distinta o fichero dañado)"; exit 1
          fi
          if ! keytool -list -keystore "$ks" -storetype PKCS12 -storepass "$KS_PASS" -alias "$KS_ALIAS" >/dev/null 2>&1; then
            echo "::error::El keystore no tiene el alias de WTTC_KEY_ALIAS (debe ser: wttc)"; exit 1
          fi
          {
            echo "WTTC_KEYSTORE_FILE=$ks"
            echo "WTTC_KEYSTORE_PASSWORD=$KS_PASS"
            echo "WTTC_KEY_PASSWORD=$KS_PASS"
            echo "WTTC_KEY_ALIAS=$KS_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Errores como anotaciones
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          grep -E '^e: |error:|What went wrong|> ' build.log | head -60 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done || true

      - name: Preparar APK y firmware
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "WTTC-${WTTC_VERSION_NAME}.apk"
          cp "WTTC-${WTTC_VERSION_NAME}.apk" WTTC.apk      # nombre fijo: releases/latest/download/WTTC.apk
          (cd firmware && zip -qr ../WTTC-firmware.zip WTTC)

      - uses: actions/upload-artifact@v4
        with:
          name: WTTC-${{ env.WTTC_VERSION_NAME }}
          path: WTTC-*.apk

      - name: Publicar en Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v${WTTC_VERSION_NAME}" "WTTC-${WTTC_VERSION_NAME}.apk" WTTC.apk WTTC-firmware.zip \
            --title "WTTC ${WTTC_VERSION_NAME}" --latest \
            --notes "App Android (WTTC.apk, Android 8 o posterior) y firmware para el ESP32 (WTTC-firmware.zip). Instrucciones: https://wttc.favala.es"
