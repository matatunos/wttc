# android.yml — Compila la app Android y publica las Releases.
# Código generado íntegramente con Claude (Anthropic).
#  1. Lee la versión del fichero VERSION y comprueba que coincide con FW_VERSION del firmware y con CHANGELOG.md.
#  2. Prepara la clave de firma desde los secretos del repo (nunca está en el código).
#  3. Compila el APK de release con Gradle.
#  4. Si esa versión aún no tiene Release, la crea con WTTC.apk, WTTC-<versión>.apk y WTTC-firmware.zip,
#     usando como notas su sección del CHANGELOG.
# Permisos mínimos: solo «contents: write», y solo en este job, para poder crear la Release.
# Secretos necesarios: WTTC_KEYSTORE_B64, WTTC_KEYSTORE_PASSWORD y WTTC_KEY_ALIAS.
name: App Android y Release

on:
  push:
    branches: [main]
    paths: ['android/**', 'firmware/**', 'VERSION', 'CHANGELOG.md', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # solo para publicar el APK en Releases
    env:
      WTTC_VERSION_CODE: ${{ github.run_number }}      # siempre crece: Android exige que cada APK nuevo tenga un código mayor
    steps:
      - uses: actions/checkout@v5

      # Una sola versión para todo: el fichero VERSION. El firmware debe decir lo mismo en FW_VERSION.
      - name: Versión
        shell: bash
        run: |
          v=$(tr -d ' \r\n' < VERSION)
          fw=$(grep -oP '#define FW_VERSION "\K[^"]+' firmware/WTTC/WTTC.ino)
          if [ "$v" != "$fw" ]; then echo "::error::VERSION ($v) y FW_VERSION del firmware ($fw) no coinciden"; exit 1; fi
          grep -q "^## $v " CHANGELOG.md || { echo "::error::Falta la sección «## $v …» en CHANGELOG.md"; exit 1; }
          echo "WTTC_VERSION_NAME=$v" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Firma estable para que cada versión se instale encima de la anterior.
      # La clave vive solo en los secretos del repo; sin ellos se firma con una clave de depuración.
      - name: Clave de firma
        env:
          KS_B64: ${{ secrets.WTTC_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.WTTC_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.WTTC_KEY_ALIAS }}
        shell: bash
        run: |
          # Si algo falla aquí, se sigue compilando (para verificar el código) con la clave de depuración,
          # pero WTTC_SIGNED queda a 0: no se publica Release y el run termina marcado como fallido.
          fallo() { echo "::error::$1"; echo "WTTC_SIGNED=0" >> "$GITHUB_ENV"; exit 0; }
          [ -n "$KS_B64" ] || fallo "Sin clave de firma en los secretos (WTTC_KEYSTORE_B64)"
          echo "::add-mask::$KS_PASS"
          ks="$RUNNER_TEMP/wttc.p12"
          # Quita espacios y saltos de línea que se cuelan al pegar el secreto
          if ! printf '%s' "$KS_B64" | tr -d ' \t\r\n' | base64 -d > "$ks" 2>/dev/null; then
            fallo "WTTC_KEYSTORE_B64 no es base64 válido (¿se pegó incompleto?)"
          fi
          # Datos que no revelan los secretos, para comparar con los ficheros originales si algo no cuadra
          echo "Keystore: $(stat -c %s "$ks") bytes, SHA-256 empieza por $(sha256sum "$ks" | cut -c1-16)"
          echo "Contraseña: ${#KS_PASS} caracteres; alias: ${#KS_ALIAS} caracteres"
          if [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            fallo "Faltan los secretos WTTC_KEYSTORE_PASSWORD o WTTC_KEY_ALIAS"
          fi
          if ! keytool -list -keystore "$ks" -storetype PKCS12 -storepass "$KS_PASS" >/dev/null 2>&1; then
            fallo "El keystore no abre con WTTC_KEYSTORE_PASSWORD (contraseña de ${#KS_PASS} caracteres; keystore $(sha256sum "$ks" | cut -c1-16))"
          fi
          if ! keytool -list -keystore "$ks" -storetype PKCS12 -storepass "$KS_PASS" -alias "$KS_ALIAS" >/dev/null 2>&1; then
            fallo "El keystore no tiene el alias de WTTC_KEY_ALIAS (debe ser: wttc)"
          fi
          {
            echo "WTTC_KEYSTORE_FILE=$ks"
            echo "WTTC_KEYSTORE_PASSWORD=$KS_PASS"
            echo "WTTC_KEY_PASSWORD=$KS_PASS"
            echo "WTTC_KEY_ALIAS=$KS_ALIAS"
            echo "WTTC_SIGNED=1"
          } >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Errores como anotaciones
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          grep -E '^e: |error:|What went wrong|> ' build.log | head -60 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done || true

      - name: Preparar APK y firmware
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "WTTC-${WTTC_VERSION_NAME}.apk"
          cp "WTTC-${WTTC_VERSION_NAME}.apk" WTTC.apk      # nombre fijo: releases/latest/download/WTTC.apk
          (cd firmware && zip -qr ../WTTC-firmware.zip WTTC)

      - uses: actions/upload-artifact@v4
        with:
          name: WTTC-${{ env.WTTC_VERSION_NAME }}
          path: WTTC-*.apk

      # Solo se publica una Release cuando cambia VERSION (si ya existe esa versión, el APK queda como artefacto del run)
      - name: Publicar en Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.WTTC_SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${WTTC_VERSION_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La Release $tag ya existe: no se publica de nuevo (sube VERSION y añade su sección al CHANGELOG para publicar)"
            exit 0
          fi
          # Notas: la sección de esta versión en CHANGELOG.md
          awk -v v="$WTTC_VERSION_NAME" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notas.md
          printf '\n---\nApp Android: **WTTC.apk** (Android 8 o posterior). Firmware para el ESP32: **WTTC-firmware.zip**.\nInstrucciones: https://wttc.favala.es · Código generado íntegramente con Claude (Anthropic).\n' >> notas.md
          gh release create "$tag" "WTTC-${WTTC_VERSION_NAME}.apk" WTTC.apk WTTC-firmware.zip \
            --title "WTTC ${WTTC_VERSION_NAME}" --latest --notes-file notas.md

      # Sin firma estable el APK compila (y queda como artefacto), pero el run se marca como fallido
      - name: Comprobar la firma
        if: env.WTTC_SIGNED != '1'
        shell: bash
        run: |
          echo "::error::APK firmado con la clave de depuración: revisa los secretos de firma. No se ha publicado Release."
          exit 1
