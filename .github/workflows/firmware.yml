# firmware.yml — Compila el firmware en GitHub con los núcleos ESP32 2.0.17 y 3.3.12 en cada cambio.
# Código generado íntegramente con Claude (Anthropic).
# Así se comprueba que el .ino compila sin tener que compilarlo en ningún servidor propio.
# Los errores de compilación se publican como anotaciones del run (visibles sin iniciar sesión).
# El binario resultante queda como artefacto del run (WTTC-firmware-core-…), y su tamaño como anotación.
name: Firmware

on:
  push:
    paths: ['firmware/**', 'VERSION', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: ESP32 core ${{ matrix.core }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ['2.0.17', '3.3.12']
    steps:
      - uses: actions/checkout@v5
      - name: Versión del firmware igual a VERSION
        shell: bash
        run: |
          v=$(tr -d ' \r\n' < VERSION); fw=$(grep -oP '#define FW_VERSION "\K[^"]+' firmware/WTTC/WTTC.ino)
          [ "$v" = "$fw" ] || { echo "::error::VERSION ($v) y FW_VERSION ($fw) no coinciden"; exit 1; }
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar el núcleo ESP32 ${{ matrix.core }}
        shell: bash
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ matrix.core }}
      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --warnings default \
            --output-dir build firmware/WTTC 2>&1 | tee build.log
      # Tamaño del programa, como anotación visible sin iniciar sesión. 1 966 080 bytes es el hueco de cada copia del
      # programa en un esquema con actualización sin cable (OTA) para 4 MB de flash («Minimal SPIFFS»): si no cabe ahí,
      # la OTA obligaría a adelgazar el firmware.
      - name: Tamaño del firmware
        shell: bash
        run: |
          n=$(grep -oP 'Sketch uses \K[0-9]+' build.log | head -1)
          ota=1966080
          echo "::notice title=Tamaño (núcleo ${{ matrix.core }})::$n bytes · hueco OTA $ota · $((n * 100 / ota)) % del hueco"
          [ "$n" -le "$ota" ] || echo "::warning title=No cabe con OTA (núcleo ${{ matrix.core }})::sobran $((n - ota)) bytes"
      - name: Errores como anotaciones
        if: failure()
        shell: bash
        run: |
          grep -E 'error|Error' build.log | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WTTC-firmware-core-${{ matrix.core }}
          path: build/WTTC.ino.*bin
