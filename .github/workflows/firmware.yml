# firmware.yml — Compila el firmware en GitHub para ESP32-S3 (la única placa soportada desde la 0.2.0), con los
# núcleos ESP32 2.0.17 y 3.3.12, en cada cambio.
# Código generado íntegramente con Claude (Anthropic).
# Así se comprueba que el .ino compila sin tener que compilarlo en ningún servidor propio.
# Los errores de compilación se publican como anotaciones del run (visibles sin iniciar sesión).
# El binario resultante queda como artefacto del run (WTTC-firmware-core-…), y su tamaño como anotación.
# Con el núcleo 3.3.12, si el repo tiene el secreto WTTC_FW_SIGN_KEY (clave privada ECDSA P-256), se monta y firma
# la actualización sin cable (WTTC-<versión>-s3.ota; hasta la 0.1.6 también había WTTC-<versión>.ota para el ESP32)
# y, en main, se adjunta a la Release de esa versión.
name: Firmware

on:
  push:
    paths: ['firmware/**', 'VERSION', '.github/workflows/firmware.yml', '.github/scripts/**']
  pull_request:
    paths: ['firmware/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: ${{ matrix.board.name }} · núcleo ${{ matrix.core }}
    runs-on: ubuntu-latest
    timeout-minutes: 60      # si una máquina de GitHub se queda colgada, que falle en vez de esperar horas
    permissions:
      contents: write          # solo para adjuntar el .ota a la Release (en main y con la clave de firma)
    env:
      WTTC_FW_SIGN_KEY: ${{ secrets.WTTC_FW_SIGN_KEY }}
    strategy:
      fail-fast: false
      matrix:
        core: ['2.0.17', '3.3.12']
        # suffix: lo que va tras la versión en el nombre del .ota
        board:
        # chip/family/boot: para instalar desde el navegador (nombre del paquete, chipFamily de ESP Web Tools y
        # dirección del cargador de arranque: 0x0 en el S3)
          - { name: 'ESP32-S3', fqbn: 'esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=huge_app', suffix: '-s3', chip: 'esp32s3', family: 'ESP32-S3', boot: 0 }
    steps:
      - uses: actions/checkout@v5
      - name: Versión del firmware igual a VERSION
        shell: bash
        run: |
          v=$(tr -d ' \r\n' < VERSION); fw=$(grep -oP '#define FW_VERSION "\K[^"]+' firmware/WTTC/WTTC.ino)
          [ "$v" = "$fw" ] || { echo "::error::VERSION ($v) y FW_VERSION ($fw) no coinciden"; exit 1; }
      # La web de la placa va dentro del firmware: se prueba su JavaScript antes de compilar (sin navegador)
      - name: Probar la web de la placa
        shell: bash
        run: node .github/scripts/probar_web.js firmware/WTTC/web.h
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar el núcleo ESP32 ${{ matrix.core }}
        shell: bash
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ matrix.core }}
      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          arduino-cli compile --fqbn '${{ matrix.board.fqbn }}' --warnings default \
            --output-dir build firmware/WTTC 2>&1 | tee build.log
      # Tamaño del programa, como anotación visible sin iniciar sesión. Tiene que caber en cada hueco de programa de
      # firmware/WTTC/partitions.csv (0x1F0000 = 2 031 616 bytes): si no, falla. El menú del IDE («Huge APP») solo
      # comprueba su propio límite de 3 MB, así que esta es la comprobación que vale.
      - name: Tamaño del firmware
        shell: bash
        run: |
          n=$(grep -oP 'Sketch uses \K[0-9]+' build.log | head -1)
          slot=$(( $(grep -oP '^app0,.*ota_0,\s*0x[0-9A-Fa-f]+,\s*\K0x[0-9A-Fa-f]+' firmware/WTTC/partitions.csv) ))
          echo "::notice title=Tamaño (${{ matrix.board.name }}, núcleo ${{ matrix.core }})::$n bytes de $slot por hueco ($((n * 100 / slot)) %)"
          [ "$n" -le "$slot" ] || { echo "::error title=No cabe (${{ matrix.board.name }}, núcleo ${{ matrix.core }})::sobran $((n - slot)) bytes"; exit 1; }
      - name: Errores como anotaciones
        if: failure()
        shell: bash
        run: |
          grep -E 'error|Error' build.log | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
      # Actualización sin cable firmada (ver .github/scripts/firmar_ota.py y otaFeed() en WTTC.ino)
      - name: Firmar la actualización OTA
        if: success() && matrix.core == '3.3.12' && env.WTTC_FW_SIGN_KEY != ''
        shell: bash
        run: |
          v=$(tr -d ' \r\n' < VERSION)
          k="$RUNNER_TEMP/fw-sign.pem"; (umask 077; printf '%s\n' "$WTTC_FW_SIGN_KEY" > "$k")
          o="build/WTTC-$v${{ matrix.board.suffix }}.ota"
          python3 .github/scripts/firmar_ota.py build/WTTC.ino.bin "$v" "$k" "$o"
          rm -f "$k"
          echo "WTTC_OTA=$o" >> "$GITHUB_ENV"; echo "WTTC_VER=$v" >> "$GITHUB_ENV"
      # Piezas para instalar desde el navegador (wttc.favala.es/instalar.php, con ESP Web Tools): cargador de arranque,
      # tabla de particiones, boot_app0 y programa, más placa.json con el chip y la dirección del cargador. La zona de
      # configuración (NVS) no va: reinstalar así no borra la configuración ni el PIN.
      - name: Piezas para instalar desde el navegador
        if: success() && matrix.core == '3.3.12'
        shell: bash
        run: |
          v=$(tr -d ' \r\n' < VERSION)
          n="instalar-${{ matrix.board.chip }}"; d="build/$n"; mkdir -p "$d"
          cp build/WTTC.ino.bootloader.bin "$d/bootloader.bin"
          cp build/WTTC.ino.partitions.bin "$d/partitions.bin"
          cp "$(find ~/.arduino15/packages/esp32/hardware/esp32 -name boot_app0.bin | head -1)" "$d/boot_app0.bin"
          cp build/WTTC.ino.bin "$d/wttc.bin"
          printf '{"version":"%s","chipFamily":"%s","bootloader":%d}\n' "$v" "${{ matrix.board.family }}" ${{ matrix.board.boot }} > "$d/placa.json"
          (cd build && zip -qr "WTTC-$v-$n.zip" "$n")
          echo "WTTC_FLASH=build/WTTC-$v-$n.zip" >> "$GITHUB_ENV"; echo "WTTC_VER=$v" >> "$GITHUB_ENV"
          echo "::notice title=Paquete de instalación (${{ matrix.board.name }})::$(cd "$d" && for f in *; do printf '%s %s B · ' "$f" "$(stat -c %s "$f")"; done)"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WTTC-firmware-${{ matrix.board.name }}-core-${{ matrix.core }}
          path: |
            build/WTTC.ino.*bin
            build/*.ota
            build/WTTC-*-instalar-*.zip
      # Adjuntar el .ota y el paquete de instalación a la Release solo si esa versión se publicó desde este mismo commit
      # (la crea android.yml): así nunca se cuelga en una Release el programa de un commit posterior con la etiqueta
      # de una versión anterior
      - name: Adjuntar a la Release
        if: success() && env.WTTC_VER != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v$WTTC_VER"
          # hasta 40 min: la Release la crea android.yml, que a veces tarda en coger máquina
          for i in $(seq 1 80); do gh release view "$tag" >/dev/null 2>&1 && break; sleep 30; done
          gh release view "$tag" >/dev/null 2>&1 || { echo "::notice::Sin Release $tag: el .ota queda solo como artefacto"; exit 0; }
          git fetch -q --tags origin
          [ "$(git rev-list -n1 "$tag")" = "$GITHUB_SHA" ] || { echo "::notice::$tag es de otro commit: no se adjunta"; exit 0; }
          have=$(gh release view "$tag" --json assets -q '.assets[].name')
          for p in $WTTC_OTA $WTTC_FLASH; do
            f=$(basename "$p")
            if grep -qx "$f" <<< "$have"; then echo "::notice::La Release ya tiene $f"; continue; fi
            gh release upload "$tag" "$p" && echo "::notice title=Publicado::$f en $tag"
          done
