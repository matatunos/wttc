# capturas.yml — Rehace las capturas del README desde la web pública con Playwright.
# Código generado íntegramente con Claude (Anthropic).
# Se lanza al cambiar el script de capturas o este workflow (o a mano desde la pestaña Actions).
# Si las imágenes cambian, las sube al repo (los commits hechos con GITHUB_TOKEN no lanzan otros workflows).
name: Capturas

on:
  push:
    branches: [main]
    paths: ['docs/capturas/capturar.mjs', '.github/workflows/capturas.yml']
  workflow_dispatch:

permissions:
  contents: write              # para subir las capturas nuevas

jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Hacer las capturas
        run: node docs/capturas/capturar.mjs
      - name: Subir las capturas si han cambiado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/capturas/*.png
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Capturas del README actualizadas"
          git push
