# limpiar-releases.yml — Borra Releases viejas (y sus etiquetas). De un solo uso: se quita después de ejecutarse.
# Código generado íntegramente con Claude (Anthropic).
# v1.0.1 y v1.0.2: firmadas con claves de depuración y sin Bluetooth. v1.1.0: renumerada como 0.1.0 (versión de prueba).
name: Limpiar Releases viejas

on:
  push:
    branches: [main]
    paths: ['.github/workflows/limpiar-releases.yml']

permissions:
  contents: write              # para borrar Releases y etiquetas

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Borrar v1.0.1, v1.0.2, v1.1.0, app-v1.0.1 y sus etiquetas
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          for t in app-v1.0.1 v1.0.2 v1.1.0; do
            if gh release view "$t" >/dev/null 2>&1; then gh release delete "$t" --cleanup-tag --yes && echo "Borrada $t"
            else echo "No existe $t"; fi
          done
          gh release list
